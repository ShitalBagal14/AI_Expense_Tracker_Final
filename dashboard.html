<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartBudget Dashboard</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Main Dashboard CSS -->
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- Common Module CSS -->
    <link rel="stylesheet" href="css/modules/base.css">
    <link rel="stylesheet" href="css/modules/layout.css">
    <link rel="stylesheet" href="css/modules/shared.css">

    <!-- Module CSS -->
    <link rel="stylesheet" href="css/modules/income.css">
    <link rel="stylesheet" href="css/modules/expenses.css">
    <link rel="stylesheet" href="css/modules/budget.css">
    <link rel="stylesheet" href="css/modules/savings.css">
    <link rel="stylesheet" href="css/modules/bills.css">
    <link rel="stylesheet" href="css/modules/reports.css">
    <link rel="stylesheet" href="css/modules/ai.css">
    <link rel="stylesheet" href="css/modules/settings.css">

    <!-- Responsive CSS MUST BE LAST -->
    <link rel="stylesheet" href="css/modules/responsive.css">
</head>
<body>

    <div class="dashboard-layout">

        <aside
            class="sidebar"
            id="sidebar-container">
        </aside>

        <div class="dashboard-main">

            <header
                class="topbar"
                id="topbar-container">
            </header>

            <main
                class="dashboard-content"
                id="modules-container">
            </main>

        </div>

    </div>

    <!-- Bill / EMI Modal -->
    <div id="bill-modal-container"></div>


    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>

    <!-- Dashboard JS -->
    <script type="module" src="js/dashboard.js"></script>

</body>
</html>
