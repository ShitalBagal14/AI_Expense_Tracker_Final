<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBudget Login</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        .form-message {margin-bottom: 16px; padding: 12px 16px; border-radius: 10px; font-weight: 600; display: none;}
        .form-message.success {background: #def7ec; color: #034d35;}
        .form-message.error {background: #fde2e1; color: #671010;}
        .form-message.visible {display: block;}
    </style>
</head>

<body class="auth-page">

    <header class="marketing-nav">
        <div class="container-wide">
            <nav class="navbar">
                <div class="logo">
                    <img src="images/logo.png" alt="AI Expense Tracker logo">
                    <div>
                        <h2>AI Expense Tracker</h2>
                    </div>
                </div>

                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#">Features</a></li>
                    <li><a href="#">AI Insights</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>

                <div class="nav-buttons">
                    <a href="login.html" class="btn-login">Login</a>
                    <a href="register.html" class="btn-register">Register</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container">

        <!-- Left Side -->
        <div class="left">

            <img src="images/login-illustration.png" alt="Login Image">

        </div>

        <!-- Right Side -->
        <div class="right">

            <div class="login-box">

                <h1>Welcome Back</h1>

                <p>Login to continue managing your expenses.</p>

                <form id="loginForm" action="http://127.0.0.1:5000/login" method="POST">
                    <div id="loginMessage" class="form-message"></div>

                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="loginEmail" name="email" placeholder="Email Address" required>
                    </div>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" name="password" placeholder="Password" required>
                    </div>

                    <div class="option">

                       

                        <a href="#">Forgot Password?</a>

                    </div>

                    <button type="submit" class="login-btn">
                        Login
                    </button>


                    <div class="register">

                        Don't have an account?

                        <a href="register.html">Register</a>

                    </div>

                </form>

            </div>

        </div>

    </div>

<script src="js/auth.js"></script>
<script>
    // Add demo credentials fallback
    document.addEventListener('DOMContentLoaded', () => {
        if (sessionStorage.getItem('smartbudgetLoggedIn') === 'true') {
            window.location.replace('dashboard.html');
        }
    });
</script>
</body>

</html>
