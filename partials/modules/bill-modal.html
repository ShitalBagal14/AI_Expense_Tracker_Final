<div id="billModal" class="bill-modal-overlay hidden">

    <div class="bill-modal">

        <!-- Header -->
        <div class="bill-modal-header">
            <div>
                <h2>Add Bill / EMI</h2>
                <p>Add and manage your regular payments</p>
            </div>

            <button type="button" class="bill-close-btn" id="closeBillModal">
                &times;
            </button>
        </div>

        <!-- Payment Type -->
        <div class="payment-type">
            <button type="button" class="payment-type-btn active" data-type="bill">
                <span class="type-icon">🧾</span>
                <div>
                    <strong>Bill</strong>
                    <small>Utilities, rent, etc.</small>
                </div>
            </button>

            <button type="button" class="payment-type-btn" data-type="emi">
                <span class="type-icon">🏦</span>
                <div>
                    <strong>EMI</strong>
                    <small>Loan payments</small>
                </div>
            </button>

            <button type="button" class="payment-type-btn" data-type="subscription">
                <span class="type-icon">🔄</span>
                <div>
                    <strong>Subscription</strong>
                    <small>Netflix, Spotify, etc.</small>
                </div>
            </button>
        </div>

        <!-- Form -->
        <form id="billForm">

            <input type="hidden" id="paymentType" value="bill">

            <div class="form-grid">

                <!-- Name -->
                <div class="form-group">
                    <label for="billName">
                        Bill / EMI Name <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="billName"
                        name="name"
                        placeholder="e.g. Electricity Bill"
                        required
                    >
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label for="billCategory">
                        Category <span>*</span>
                    </label>

                    <select id="billCategory" name="category" required>
                        <option value="">Select category</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Rent">Rent</option>
                        <option value="Internet">Internet</option>
                        <option value="Mobile">Mobile</option>
                        <option value="Education">Education</option>
                        <option value="Insurance">Insurance</option>
                        <option value="Loan">Loan</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- Amount -->
                <div class="form-group">
                    <label for="billAmount">
                        Amount (₹) <span>*</span>
                    </label>

                    <input
                        type="number"
                        id="billAmount"
                        name="amount"
                        placeholder="Enter amount"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <!-- Due Date -->
                <div class="form-group">
                    <label for="dueDate">
                        Due Date <span>*</span>
                    </label>

                    <input
                        type="date"
                        id="dueDate"
                        name="due_date"
                        required
                    >
                </div>

                <!-- Frequency -->
                <div class="form-group">
                    <label for="frequency">
                        Frequency <span>*</span>
                    </label>

                    <select id="frequency" name="frequency" required>
                        <option value="">Select frequency</option>
                        <option value="Once">Once</option>
                        <option value="Monthly">Monthly</option>
                        <option value="Quarterly">Quarterly</option>
                        <option value="Yearly">Yearly</option>
                    </select>
                </div>

                <!-- Payment Method -->
                <div class="form-group">
                    <label for="paymentMethod">
                        Payment Method
                    </label>

                    <select id="paymentMethod" name="payment_method">
                        <option value="">Select payment method</option>
                        <option value="UPI">UPI</option>
                        <option value="Debit Card">Debit Card</option>
                        <option value="Credit Card">Credit Card</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="Cash">Cash</option>
                        <option value="Auto Debit">Auto Debit</option>
                    </select>
                </div>

            </div>

            <!-- EMI Extra Fields -->
            <div id="emiFields" class="emi-fields hidden">

                <div class="emi-section-title">
                    <h3>EMI Details</h3>
                    <p>Enter loan information</p>
                </div>

                <div class="form-grid">

                    <div class="form-group">
                        <label for="loanName">
                            Loan Name
                        </label>

                        <input
                            type="text"
                            id="loanName"
                            placeholder="e.g. SBI Personal Loan"
                        >
                    </div>

                    <div class="form-group">
                        <label for="loanAmount">
                            Total Loan Amount (₹)
                        </label>

                        <input
                            type="number"
                            id="loanAmount"
                            placeholder="e.g. 250000"
                            min="0"
                        >
                    </div>

                    <div class="form-group">
                        <label for="interestRate">
                            Interest Rate (%)
                        </label>

                        <input
                            type="number"
                            id="interestRate"
                            placeholder="e.g. 8.5"
                            min="0"
                            step="0.01"
                        >
                    </div>

                    <div class="form-group">
                        <label for="totalEmi">
                            Total EMIs
                        </label>

                        <input
                            type="number"
                            id="totalEmi"
                            placeholder="e.g. 36"
                            min="1"
                        >
                    </div>

                </div>

            </div>

            <!-- Notes -->
            <div class="form-group full-width">
                <label for="billNotes">
                    Notes
                </label>

                <textarea
                    id="billNotes"
                    name="notes"
                    rows="3"
                    placeholder="Add any additional notes..."
                ></textarea>
            </div>

            <!-- Active -->
            <div class="active-option">

                <label class="switch">
                    <input
                        type="checkbox"
                        id="billActive"
                        checked
                    >
                    <span class="slider"></span>
                </label>

                <div>
                    <strong>Set as active</strong>
                    <small>Track this payment on your dashboard</small>
                </div>

            </div>

            <!-- Footer -->
            <div class="bill-modal-footer">

                <button
                    type="button"
                    class="btn-cancel"
                    id="cancelBillModal"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn-save"
                >
                    <i class="fa-solid fa-plus"></i>
                    Save Bill / EMI
                </button>

            </div>

        </form>

    </div>

</div>
