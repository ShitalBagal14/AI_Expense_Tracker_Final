<!-- =========================================================
     ADD BILL / EMI MODAL
========================================================= -->

<div id="billModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Add Bill / EMI</h3>
            <button class="modal-close" id="closeBillModal">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <form class="bill-form" id="billForm">
            <div class="form-grid">
                <!-- Type -->
                <div class="form-group">
                    <label for="billType">Type</label>
                    <select id="billType" name="billType" required>
                        <option value="">Select Type</option>
                        <option value="bill">Bill</option>
                        <option value="emi">EMI</option>
                        <option value="subscription">Subscription</option>
                    </select>
                </div>

                <!-- Name/Title -->
                <div class="form-group">
                    <label for="billName">Name / Title</label>
                    <input type="text" id="billName" name="billName" placeholder="e.g., Home Loan EMI" required>
                </div>

                <!-- Lender/Biller -->
                <div class="form-group">
                    <label for="billLender">Lender / Biller</label>
                    <input type="text" id="billLender" name="billLender" placeholder="e.g., HDFC Bank" required>
                </div>

                <!-- Amount -->
                <div class="form-group">
                    <label for="billAmount">Amount (₹)</label>
                    <input type="number" id="billAmount" name="billAmount" placeholder="Enter amount" required min="0">
                </div>

                <!-- Start Date -->
                <div class="form-group">
                    <label for="billStartDate">Start Date</label>
                    <input type="date" id="billStartDate" name="billStartDate" required>
                </div>

                <!-- Due Date (Monthly) -->
                <div class="form-group">
                    <label for="billDueDate">Due Date (Monthly)</label>
                    <input type="number" id="billDueDate" name="billDueDate" placeholder="e.g., 05 (day of month)" min="1" max="31">
                </div>

                <!-- Tenure (for EMI) -->
                <div class="form-group emi-field">
                    <label for="billTenure">Tenure (Months)</label>
                    <input type="number" id="billTenure" name="billTenure" placeholder="e.g., 240" min="1">
                </div>

                <!-- Interest Rate (for EMI) -->
                <div class="form-group emi-field">
                    <label for="billInterestRate">Interest Rate (% p.a.)</label>
                    <input type="number" id="billInterestRate" name="billInterestRate" placeholder="e.g., 8.50" step="0.01" min="0">
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label for="billCategory">Category</label>
                    <select id="billCategory" name="billCategory" required>
                        <option value="">Select Category</option>
                        <option value="housing">Housing</option>
                        <option value="utilities">Utilities</option>
                        <option value="transportation">Transportation</option>
                        <option value="food">Food & Dining</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="healthcare">Healthcare</option>
                        <option value="education">Education</option>
                        <option value="insurance">Insurance</option>
                        <option value="subscriptions">Subscriptions</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Payment Mode -->
                <div class="form-group">
                    <label for="billPaymentMode">Payment Mode</label>
                    <select id="billPaymentMode" name="billPaymentMode" required>
                        <option value="">Select Payment Mode</option>
                        <option value="auto_debit">Auto Debit</option>
                        <option value="manual">Manual Payment</option>
                        <option value="upi">UPI</option>
                        <option value="card">Credit Card</option>
                        <option value="net_banking">Net Banking</option>
                        <option value="cash">Cash</option>
                    </select>
                </div>

                <!-- Notes (Optional) -->
                <div class="form-group full-width">
                    <label for="billNotes">Notes (Optional)</label>
                    <textarea id="billNotes" name="billNotes" placeholder="Add any notes..." rows="3"></textarea>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="cancelBillBtn">Cancel</button>
                <button type="submit" class="btn btn-primary" id="saveBillBtn">Save Bill / EMI</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Overlay -->
<div id="billModalOverlay" class="modal-overlay"></div>
