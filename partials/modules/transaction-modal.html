<!-- Transaction Modal -->
<div id="transactionModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Add New Transaction</h3>
            <button class="modal-close" id="closeTransactionModal">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form class="transaction-form" id="transactionForm">
            <div class="form-grid">

                <!-- Transaction Type -->
                <div class="form-group full-width">
                    <label>Transaction Type</label>
                    <div class="type-toggle">
                        <label class="type-option selected">
                            <input type="radio" name="transactionType" value="expense" checked>
                            <i class="fa-solid fa-arrow-down"></i> Expense
                        </label>
                        <label class="type-option">
                            <input type="radio" name="transactionType" value="income">
                            <i class="fa-solid fa-arrow-up"></i> Income
                        </label>
                    </div>
                </div>

                <!-- Amount -->
                <div class="form-group">
                    <label for="transactionAmount">Amount (₹)</label>
                    <input
                        type="number"
                        id="transactionAmount"
                        name="transactionAmount"
                        placeholder="Enter amount"
                        required
                        min="0"
                        step="0.01"
                    >
                </div>

                <!-- Date -->
                <div class="form-group">
                    <label for="transactionDate">Date</label>
                    <input
                        type="date"
                        id="transactionDate"
                        name="transactionDate"
                        required
                    >
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label for="transactionCategory">Category</label>
                    <select
                        id="transactionCategory"
                        name="transactionCategory"
                        required
                    >
                        <option value="">Select category</option>
                        <option value="Food & Dining">Food & Dining</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Education">Education</option>
                        <option value="Salary">Salary</option>
                        <option value="Investment">Investment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- Payment Method -->
                <div class="form-group">
                    <label for="paymentMethod">Payment Method</label>
                    <select
                        id="paymentMethod"
                        name="paymentMethod"
                        required
                    >
                        <option value="">Select method</option>
                        <option value="Cash">Cash</option>
                        <option value="Credit Card">Credit Card</option>
                        <option value="Debit Card">Debit Card</option>
                        <option value="UPI">UPI</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        <option value="Net Banking">Net Banking</option>
                    </select>
                </div>

                <!-- Description -->
                <div class="form-group full-width">
                    <label for="transactionDescription">Description</label>
                    <textarea
                        id="transactionDescription"
                        name="transactionDescription"
                        rows="3"
                        placeholder="Enter transaction description..."
                    ></textarea>
                </div>

                <!-- Notes -->
                <div class="form-group full-width">
                    <label for="transactionNotes">Notes (Optional)</label>
                    <textarea
                        id="transactionNotes"
                        name="transactionNotes"
                        rows="2"
                        placeholder="Add any additional notes..."
                    ></textarea>
                </div>

            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary" id="cancelTransactionBtn">
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary" id="saveTransactionBtn">
                    <i class="fa-solid fa-save"></i>
                    Save Transaction
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Overlay -->
<div id="transactionModalOverlay" class="modal"></div>
