<section class="module-panel expenses-panel hidden" data-panel="expenses-panel">
    <div class="module-card card-glow expenses-panel-card">
        <div class="module-header">
            <h2>Add Expense</h2>
            <p>Log expenses and manage where money goes.</p>
        </div>
        <form class="entry-form expense-entry-form">
            <div class="form-grid">
                <label>
                    <span>Category</span>
                    <select>
                        <option value="food">Food & Dining</option>
                        <option value="transportation">Transportation</option>
                        <option value="housing">Housing</option>
                        <option value="utilities">Utilities</option>
                        <option value="entertainment">Entertainment</option>
                    </select>
                </label>
                <label>
                    <span>Amount (₹)</span>
                    <input type="number" min="0" step="0.01" placeholder="Enter amount">
                </label>
                <label>
                    <span>Date</span>
                    <input type="date">
                </label>
                <label>
                    <span>Payment Method</span>
                    <select>
                        <option value="upi">UPI</option>
                        <option value="debit">Debit Card</option>
                        <option value="credit">Credit Card</option>
                        <option value="cash">Cash</option>
                    </select>
                </label>
                <label class="full-width">
                    <span>Description (Optional)</span>
                    <input type="text" placeholder="Enter description">
                </label>
            </div>
            <button type="submit" class="primary-btn">Add Expense</button>
        </form>
    </div>
</section>
