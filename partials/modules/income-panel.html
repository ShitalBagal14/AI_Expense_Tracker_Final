<section class="module-panel income-panel hidden" data-panel="income-panel">
    <div class="module-card card-glow income-panel-card">
        <div class="module-header">
            <h2>Add Income</h2>
            <p>Record income quickly and keep your cash flow updated.</p>
        </div>
        <form class="entry-form income-entry-form">
            <div class="form-grid">
                <label>
                    <span>Source of Income</span>
                    <select>
                        <option value="salary">Salary</option>
                        <option value="freelance">Freelance</option>
                        <option value="business">Business</option>
                        <option value="other">Other</option>
                    </select>
                </label>
                <label>
                    <span>Amount (₹)</span>
                    <input type="number" min="0" step="0.01" placeholder="Enter amount">
                </label>
                <label>
                    <span>Date</span>
                    <input type="date">
                </label>
                <label>
                    <span>Description (Optional)</span>
                    <input type="text" placeholder="Enter description">
                </label>
            </div>
            <button type="submit" class="primary-btn">Add Income</button>
        </form>
    </div>
</section>
